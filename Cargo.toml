[workspace]
resolver = "2"
members = ["engine", "game", "tools/convert-custom-hill"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ski Jump 3 Team"]
license = "MIT"

[workspace.dependencies]
sdl2 = { version = "0.38", features = ["static-link", "unsafe_textures"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "console",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "ImageData",
    "KeyboardEvent",
    "Window",
] }

[workspace.lints.clippy]
ptr_arg = "warn"
clone_on_copy = "warn"
redundant_clone = "warn"

[package]
name = "skijump3"
version.workspace = true
edition.workspace = true

[[bin]]
name = "skijump3"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
engine = { path = "engine" }
game = { path = "game" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
