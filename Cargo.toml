[workspace]
resolver = "2"
members = ["engine", "game", "tools/convert-custom-hill"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ski Jump 3 Team"]
license = "MIT"

[workspace.dependencies]
sdl2 = { version = "0.38", features = ["bundled", "static-link", "unsafe_textures"] }

[workspace.lints.clippy]
ptr_arg = "warn"
clone_on_copy = "warn"
redundant_clone = "warn"

[package]
name = "skijump3"
version.workspace = true
edition.workspace = true

[[bin]]
name = "skijump3"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
engine = { path = "engine" }
game = { path = "game" }
